---
name: Required
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  long-comments:
    uses: femiwiki/.github/.github/workflows/long-comments.yml@507a9454c109a7073519642624366dc55a18dfba
    permissions:
      contents: read

  shared-lint:
    uses: femiwiki/.github/.github/workflows/shared-lint.yml@507a9454c109a7073519642624366dc55a18dfba
    permissions:
      contents: read

  required-gate:
    uses: femiwiki/.github/.github/workflows/required-gate.yml@507a9454c109a7073519642624366dc55a18dfba
    permissions:
      contents: read

  # The one check branch protection requires. What has to pass is the
  # workflows called above, so adding a check does not touch femiwiki/infra.
  required:
    needs: [long-comments, shared-lint, required-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every workflow above passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
