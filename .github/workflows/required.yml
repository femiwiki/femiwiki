---
name: Required
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  long-comments:
    uses: femiwiki/.github/.github/workflows/long-comments.yml@f6520fe7489843cd37df470d5030143c868e6674
    permissions:
      contents: read

  shared-lint:
    uses: femiwiki/.github/.github/workflows/shared-lint.yml@f6520fe7489843cd37df470d5030143c868e6674
    permissions:
      contents: read

  # The one check branch protection requires. What has to pass is the
  # workflows called above, so adding a check does not touch femiwiki/infra.
  required:
    needs: [long-comments, shared-lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every workflow above passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
