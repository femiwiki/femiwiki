---
name: Required
on:
  push:
    branches: [main]
  pull_request:
# A new commit on a pull request cancels the run on its old commit; runs on
# main each get a group of their own and are never cancelled.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ case(github.event_name == 'pull_request',
    github.event.pull_request.number, github.run_id) }}
  cancel-in-progress: true
permissions: {}
jobs:
  long-comments:
    uses: femiwiki/.github/.github/workflows/long-comments.yml@30a15e0ace6fb2bf70dff4d04b4276404a3d10b6
    permissions:
      contents: read

  shared-lint:
    uses: femiwiki/.github/.github/workflows/shared-lint.yml@30a15e0ace6fb2bf70dff4d04b4276404a3d10b6
    permissions:
      contents: read

  required-gate:
    uses: femiwiki/.github/.github/workflows/required-gate.yml@30a15e0ace6fb2bf70dff4d04b4276404a3d10b6
    permissions:
      contents: read

  # The one check branch protection requires. What has to pass is the
  # workflows called above, so adding a check does not touch femiwiki/infra.
  required:
    needs: [long-comments, shared-lint, required-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every workflow above passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
